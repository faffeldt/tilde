<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Felix's personal home page and blog.">
  <title>felix@tilde ~</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="terminal.js" defer></script>
</head>
<body>
  <noscript>
    <h1>Felix</h1>
    <p>
      Software engineer working across systems programming and backend/infra tooling.
      I like simplifying complex systems and making them more resilient.
      Read more <a href="about.html">about me</a>, visit the <a href="blog/">blog</a>
      or find me on <a href="https://github.com/faffeldt">GitHub</a>.
    </p>
  </noscript>
  <main id="terminal" hidden>
    <div id="output" role="log"></div>
    <div id="input-line">
      <span id="prompt" class="prompt"></span>
      <input
        id="command"
        type="text"
        aria-label="Command"
        autocapitalize="off"
        autocorrect="off"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
  </main>
</body>
</html>
