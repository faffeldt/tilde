[tools]
node = "26.13.0"
lychee = "0.24.2"
miniserve = "0.35.0"

[tasks.serve]
description = "Preview the site at http://localhost:8000"
run = "miniserve docs --index index.html --interfaces 127.0.0.1 --port 8000"

[tasks.check]
description = "Lint, check formatting, and check local links and assets"
run = [
  "npx biome ci --error-on-warnings",
  "lychee --offline --no-progress --index-files index.html docs",
]

[tasks.fmt]
description = "Format and apply safe lint fixes"
run = "npx biome check --write"

[tasks.test]
description = "Run the unit tests, then the browser tests against a local server"
run = [
  "npx vitest run",
  "npx playwright test",
]
