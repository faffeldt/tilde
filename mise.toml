[tools]
lychee = "0.24.2"
miniserve = "0.35.0"

[tasks.serve]
description = "Preview the site at http://localhost:8000"
run = "miniserve docs --index index.html --interfaces 127.0.0.1 --port 8000"

[tasks.check]
description = "Check local links and assets"
run = "lychee --offline --no-progress --index-files index.html docs"
